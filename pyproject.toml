[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papermine"
version = "0.1.0"
description = "从横向项目工作中挖掘候选论文点的本地工具"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
papermine = "papermine.cli:main"

[tool.setuptools.packages.find]
include = ["papermine*"]
