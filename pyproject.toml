[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papermine"
version = "0.3.0"
description = "从横向项目工作中挖掘候选论文点的本地工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["httpx>=0.24"]
license = { text = "MIT" }
authors = [{ name = "papermine contributors" }]
keywords = ["research", "paper", "academic", "mining", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/ari231233/work2paper"
Repository = "https://github.com/ari231233/work2paper.git"
Issues = "https://github.com/ari231233/work2paper/issues"
Changelog = "https://github.com/ari231233/work2paper/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Web 外壳（M24/M25）：FastAPI + uvicorn 作为可选依赖，核心依赖仍只有 httpx（架构 §15「核心引擎 + 多外壳」）。
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.9"]

[project.scripts]
papermine = "papermine.cli:main"

[tool.setuptools.packages.find]
include = ["papermine*", "web*"]
